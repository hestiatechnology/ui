name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate components manifest
        run: npm run generate:components --prefix projects/hestia-ui

      - name: Set version from release tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version --prefix projects/hestia-ui
          # Sync mcp-hestia-ui version with main hestia-ui package
          HESTIA_VERSION=$(grep '"version"' projects/hestia-ui/package.json | head -1 | grep -oP '\d+\.\d+\.\d+')
          npm version $HESTIA_VERSION --no-git-tag-version --allow-same-version --prefix tools/mcp-hestia-ui

      - run: pnpm build

      - name: Copy components manifest into dist
        if: always()
        run: |
          if [ -f projects/hestia-ui/components.json ]; then
            mkdir -p ./dist/hestia-ui
            cp projects/hestia-ui/components.json ./dist/hestia-ui/components.json
            echo "Copied components.json to ./dist/hestia-ui"
          else
            echo "No components.json found to copy"
          fi

      - name: Publish hestia-ui to npm
        run: npm publish ./dist/hestia-ui --access public --provenance

      - name: Publish mcp-hestia-ui to npm
        run: npm publish ./tools/mcp-hestia-ui --access public --provenance

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/hestia-ui/package.json tools/mcp-hestia-ui/package.json
          git commit -m "chore: bump version to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
